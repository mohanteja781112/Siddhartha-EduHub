name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 12:00 PM (UTC) every 5 days
    - cron: '0 12 */5 * *'
  workflow_dispatch: # Allows you to run it manually by clicking a button in GitHub
1
jobs:
  ping_database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to prevent auto-pause..."
          curl -sS --request GET \
            --url "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            --header "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "Ping successful! Database activity registered."
