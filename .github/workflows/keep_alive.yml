name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 12:00 PM (UTC) every 6 days
    - cron: '0 12 */6 * *'
  workflow_dispatch: # Allows you to run it manually by clicking a button in GitHub
jobs:
  ping_database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase to prevent auto-pause..."
          echo "Checking if URL secret is present..."
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "Error: SUPABASE_URL secret is empty!"
            exit 1
          fi
          curl -sS -v --request GET \
            --url "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            --header "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            --header "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo -e "\n\nPing successful! Database activity registered."